name: Deploy Backend

on:
  push:
    branches: [ main, uat, dev ]
  pull_request:
    branches: [ main, uat, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Build application JAR
      run: ./mvnw clean package -DskipTests

  build-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/uat'

    steps:
    - uses: actions/checkout@v4
    
    - name: Install OpenVPN
      run: |
        sudo apt update
        sudo apt install -y openvpn openvpn-systemd-resolved
        
    - name: Connect to VPN
      uses: "kota65535/github-openvpn-connect-action@v2"
      with:
        config_file: .github/workflows/sitst-client.ovpn
        username: ${{ secrets.OVPN_USERNAME }}
        password: ${{ secrets.OVPN_PASSWORD }}
      
    - name: Build Docker image
      run: |
        # Decide environment
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          PROFILE=prod
        elif [ "${{ github.ref }}" = "refs/heads/uat" ]; then
          PROFILE=uat
        else
          PROFILE=dev
        fi

        echo "Building with profile: $PROFILE"

        docker build \
          --build-arg SPRING_PROFILES_ACTIVE=$PROFILE \
          -t integrated-be:${{ github.sha }} .
        docker tag integrated-be:${{ github.sha }} integrated-be:latest
        
    - name: Save Docker image
      run: docker save integrated-be:latest | gzip > integrated-be.tar.gz
      
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Create directory if not exists
          mkdir -p ~/integrated-deployment
          
          # Stop and remove only backend-related containers
          cd ~/integrated-deployment
          docker-compose stop backend mysql || true
          docker-compose rm -f backend mysql || true
          
          # Remove old images
          docker rmi integrated-mysql:latest || true
          docker rmi integrated-be:latest || true
#          docker image prune -f
          
    - name: Copy files to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "integrated-be.tar.gz,docker-compose.yml,db/"
        target: "~/integrated-deployment/"
        
    - name: Deploy on VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd ~/integrated-deployment
          
          # Load Docker image
          docker load < integrated-be.tar.gz
          rm integrated-be.tar.gz
          
          # Set environment
          # export SPRING_PROFILES_ACTIVE=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          if [ "${github.ref}" = "refs/heads/main" ]; then
            export SPRING_PROFILES_ACTIVE=prod
          elif [ "${github.ref}" = "refs/heads/uat" ]; then
            export SPRING_PROFILES_ACTIVE=uat
          else
            export SPRING_PROFILES_ACTIVE=dev
          fi
          
          # Create network and volumes if they don't exist
          docker network create integrated-network 2>/dev/null || true
          docker volume create backend_uploads 2>/dev/null || true
          
          # Start only backend services (mysql + backend)
          docker-compose up -d mysql backend
          
          # Wait for backend health check
          sleep 30
          
          # Verify backend deployment
          docker-compose ps backend mysql
          
          # Clean up old images
#          docker image prune -f