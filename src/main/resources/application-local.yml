spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce?useSSL=true&serverTimezone=Asia/Bangkok
    username: root
    password: rootpass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true

app:
  env: LOCAL
  cors:
    enabled: true
    allowed-origin: http://localhost:5173
  file:
    upload-dir: ${user.dir}/uploads
  cookies:
    domain: localhost
  frontend-url: http://localhost:5173